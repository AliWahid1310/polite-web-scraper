name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite & Scraper Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Code Quality & Lint Check
        run: |
          ruff check src/ tests/

      - name: Run Pytest Comprehensive Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify Full Scraper Pipeline Execution
        run: |
          python src/main.py

      - name: Verify Multi-Format Exports & Artifacts
        run: |
          python -c "import os; assert os.path.exists('output/dashboard.html'); assert os.path.exists('output/books.db'); assert os.path.exists('output/books.csv'); assert os.path.exists('output/books.md')"
